<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LingoWeb - Lección Chino Mandarín</title>
    <link rel="stylesheet" href="lecciones.css">
</head>
<body class="leccion-body">
    
    <header class="header-leccion">
        <a href="../Mapas/mapa-chino.html" class="btn-cerrar" aria-label="Volver al mapa">✖</a>
        <progress value="0" max="100" class="barra-progreso"></progress>
    </header>

    <main class="contenido-leccion">
        <h1>Traduce esta frase</h1>
        
        <blockquote class="burbuja-texto">
            Yo como manzana.
        </blockquote>

        <section class="zona-respuesta" aria-label="Tu respuesta">
            <span class="linea-vacia"></span>
            <span class="linea-vacia"></span>
        </section>

        <!-- Agregamos el atributo lang="zh" -->
        <section class="banco-palabras" aria-label="Opciones de palabras">
            <button class="btn-palabra">苹果 (píngguǒ)</button>
            <button class="btn-palabra">喝 (hē)</button>
            <button class="btn-palabra">我 (wǒ)</button>
            <button class="btn-palabra">水 (shuǐ)</button>
            <button class="btn-palabra">吃 (chī)</button>
            <button class="btn-palabra">你 (nǐ)</button>
        </section>
    </main>

    <footer class="footer-leccion">
        <h2></h2> 
        <a href="leccion-acierto-chino.html" class="btn-primario">Comprobar Respuesta</a>
    </footer>

</body>
</html>
