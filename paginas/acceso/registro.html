<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>registro</title>
    <link rel="stylesheet" href="acceso.css">
    <link rel="stylesheet" href="../../barra-de-navegación-css/general.css">
</head>

<body>

    <header>
        <img src="https://i.ibb.co/NdL1bw7N/LINGOWEB.png" alt="imagotipo de LingoWeb">
    </header>

    <section>
        <form id="formulario-registro">
            <label for="nombre">Nombre y Apellido</label>
            <input type="text" id="nombre" name="nombre" required>
            <p id="error-nombre" class="mensaje-error-campo"></p>

            <label for="email">Email</label>
            <input type="email" id="email" name="email" required>
            <p id="error-email" class="mensaje-error-campo"></p>

            <label for="usuario">Crear nombre de usuario</label>
            <input type="text" id="usuario" name="usuario" required>
            <p id="error-usuario" class="mensaje-error-campo"></p>

            <label for="contrasena">Crear contraseña</label>
            <input type="password" id="contrasena" name="contrasena" minlength="8" required>

            <ul class="requisitos-clave">
                <li id="requisito-longitud">Al menos 8 caracteres</li>
                <li id="requisito-mayuscula">Una letra mayúscula</li>
                <li id="requisito-minuscula">Una letra minúscula</li>
                <li id="requisito-numero">Un número</li>
            </ul>

            <p id="error-contrasena" class="mensaje-error-campo"></p>

            <label for="confirmar-contrasena">Confirmar contraseña</label>
            <input type="password" id="confirmar-contrasena" name="confirmar-contrasena" minlength="8" required>
            <p id="error-confirmar-contrasena" class="mensaje-error-campo"></p>

            <button type="submit"><strong>CREAR CUENTA</strong></button>
        </form>

        <a href="login.html">¿Ya tenés una cuenta? Hacé click aquí</a>
    </section>

    <script src="../../js/models/usuario.model.js"></script>
    <script src="../../js/services/usuario.service.js"></script>
    <script src="../../js/services/contrasena.util.js"></script>
    <script src="../../js/main.vista1.js"></script>
</body>

</html>
