<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recuperar contraseña</title>
    <link rel="stylesheet" href="acceso.css">
    <link rel="stylesheet" href="../../barra-de-navegación-css/general.css">
</head>

<body>

    <header>
        <img src="https://i.ibb.co/NdL1bw7N/LINGOWEB.png" alt="imagotipo de LingoWeb">
    </header>

    <section>
        <form id="formulario-nueva-contrasena">

            <label for="nueva-contrasena">Nueva contraseña</label>
            <input type="password" id="nueva-contrasena" minlength="8" required>

            <ul class="requisitos-clave">
                <li id="recuperacion-longitud">Al menos 8 caracteres</li>
                <li id="recuperacion-mayuscula">Una letra mayúscula</li>
                <li id="recuperacion-minuscula">Una letra minúscula</li>
                <li id="recuperacion-numero">Un número</li>
            </ul>

            <p id="error-nueva-contrasena" class="mensaje-error-campo"></p>

            <label for="confirmar-nueva-contrasena">Confirmar contraseña</label>
            <input type="password" id="confirmar-nueva-contrasena" minlength="8" required>

            <p id="error-confirmar-nueva-contrasena" class="mensaje-error-campo"></p>

            <button type="submit"><strong>CONFIRMAR</strong></button>
        </form>

        <a href="login.html">Volver al inicio de sesión</a>
    </section>

<script src="../../js/models/usuario.model.js"></script>
<script src="../../js/services/usuario.service.js"></script>
<script src="../../js/main.vista1.js"></script>
</body>

</html>
